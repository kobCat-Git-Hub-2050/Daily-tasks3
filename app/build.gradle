plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taqwimi.mahaam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.taqwimi.mahaam'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
