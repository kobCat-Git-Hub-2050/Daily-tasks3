name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # صلاحيات ضرورية لتمكين الكود من إنشاء الـ Release ورفع الملف إليه
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate the Android project from index.html
        run: python3 make_project.py

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      # خطوة لإنشاء تاج رقمي فريد يعتمد على وقت النظام لتجنب التعارض
      - name: Generate Tag
        id: tag
        run: |
          tag_name="v1.0.$(date +%Y%m%d%H%M%S)"
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT

      # خطوة نشر الإصدار ورفع ملف الـ APK مباشرة إلى قسم Releases
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Automatic App Release ${{ steps.tag.outputs.tag_name }}"
          body: "تطبيق تقويمي مهام (Taqwimi Mahaam) مبني ومحدث تلقائياً عبر GitHub Actions."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
