name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: اختبارات منطق التنبيهات
        run: bash verify/run_tests.sh

      - name: بناء APK
        run: gradle assembleDebug --no-daemon

      - name: تسمية الملف
        run: cp app/build/outputs/apk/debug/app-debug.apk taqwimi-1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Daily-tasks1-apk-${{ github.run_number }}
          path: taqwimi-1.apk
