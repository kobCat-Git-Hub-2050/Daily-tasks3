name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate the Android project from index.html
        run: |
          F=$(find . -name make_project.py -not -path './android/*' | head -n 1)
          if [ -z "$F" ]; then echo "ERROR: make_project.py was not uploaded to the repository"; exit 1; fi
          python3 "$F"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk taqwimi.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: taqwimi-apk
          path: taqwimi.apk

      - name: Publish taqwimi.apk as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" taqwimi.apk --title "Taqwimi APK ${{ github.run_number }}" --notes "Debug APK built from this repository."
